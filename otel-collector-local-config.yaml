receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
        cors:
          allowed_origins:
            - "http://localhost:3000"
            - "http://localhost:8000"
            - "http://localhost:5173"
          # Added to prevent CORS preflight blocks from browsers
          allowed_headers:
            - "content-type"
            - "x-otlp-version"

  # NEW: Scrapes Nginx status from your UI container
  nginx:
    endpoint: "http://dynaman-ui:80/nginx_status"
    collection_interval: 10s

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [2ms, 6ms, 10ms, 100ms, 250ms, 500ms, 1s, 5s]
    dimensions:
      - name: http.request.method
      - name: http.response.status_code
      - name: deployment.environment

processors:
  batch:
    send_batch_size: 8192
    timeout: 10s
  
  cumulativetodelta:

  resourcedetection:
    detectors: [env, system]

exporters:
  otlphttp/newrelic:
    endpoint: "https://otlp.nr-data.net"
    headers:
      "api-key": "${NEW_RELIC_INGEST_KEY}"
  
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlphttp/newrelic, spanmetrics]
      
    metrics:
      # Added 'nginx' to the receivers list
      receivers: [otlp, spanmetrics, nginx]
      processors: [resourcedetection, cumulativetodelta, batch]
      exporters: [otlphttp/newrelic, debug]